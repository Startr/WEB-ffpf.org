logo_url:
  https://startr.style/logo.png

#backend:
#  name: git-gateway
#  branch: master # Branch to update (optional; defaults to master)
#  local_backend: true # Use the local backend for development

backend:
  name: github
  repo: Startr/WEB-ffpf.org
  branch: master # Branch to update (optional; defaults to master)
  #site_domain: https://ffpf.org/ # only Needed when publishing with Cloudflare functions
  #base_url: https://ffpf.org/    # only Needed when publishing with Cloudflare functions
  #auth_endpoint: /api/auth       # only Needed when publishing with Cloudflare functions

local_backend:
  url: http://127.0.0.1:8082/api/v1 # URL to the local backend
  allowed_hosts: ["127.0.0.1"] # List of allowed hosts

media_folder: "src/public/uploads" # Path to where uploaded files will be stored in your repo
public_folder: "/public/uploads" # Path users will access the files from on the deployed site

i18n:
  structure: multiple_folders
  locales: [en, fr, de, pt]

collections:
  # Sections shown on EVERY year page. Edit once, changes everywhere.
  - name: "links" # Used in routes, e.g., /admin/collections/links
    label: "Shared Links (all years)" # Used in the UI
    folder: "src/_data/links" # The path to the folder where the documents are stored
    create: true # Allow users to create new documents in this collection
    slug: "{{slug}}" # Filename template, e.g., social-media.yml
    extension: "yml" # File extension for data files
    format: "yml" # Data format
    i18n: true
    fields: &link_section_fields # Reused by every per-year collection below
      - { label: "Section Name", name: "section", widget: "string", i18n: true, hint: "e.g., 'Social Media', 'Main Actions', 'Events'" }
      - { label: "Display Order", name: "order", widget: "number", default: 1, hint: "Lower numbers appear first" }
      - { label: "Links", name: "links", widget: "list", i18n: true, fields: [
          { label: "Title", name: "title", widget: "string", i18n: true },
          { label: "URL", name: "url", widget: "string", i18n: duplicate },
          { label: "Icon", name: "icon", widget: "string", required: false, hint: "FontAwesome class (e.g., 'fa-brands fa-instagram') or emoji" },
          { label: "Description", name: "description", widget: "text", required: false, i18n: true },
          { label: "Button Style", name: "style", widget: "select", options: ["primary", "secondary", "social"], default: "primary" },
          { label: "Order", name: "order", widget: "number", default: 1 }
        ]}

  # One file per year, named for the year (2026.yml). Hit "New Year Page" to add
  # the next one — the site builds /2025/, /2026/, /2027/ ... from whatever is here.
  - name: "links-years"
    label: "Year Pages (Events)"
    label_singular: "Year Page"
    folder: "src/_data/links/years"
    create: true
    slug: "{{slug}}" # Filename is the year, e.g. 2027.yml
    extension: "yml"
    format: "yml"
    i18n: true
    fields: *link_section_fields

  - name: "pages" # Used in routes, e.g., /admin/collections/pages
    label: "Pages" # Used in the UI
    folder: "src/pages" # The path to the folder where the documents are stored
    create: true # Allow users to create new documents in this collection
    slug: "{{slug}}" # Filename template, e.g., title.md
    i18n: true
    fields: # The fields for each document, usually in front matter
      - { label: "Layout", name: "layout", widget: "hidden", default: "layouts/base.html" }
      - { label: "Title", name: "title", widget: "string", i18n: true }
      - { label: "Publish Date", name: "date", widget: "datetime", i18n: duplicate }
      - { label: "Body", name: "body", widget: "markdown", i18n: true }
  - name: "blog" # Used in routes, e.g., /admin/collections/blog
    label: "Blog" # Used in the UI
    folder: "src/posts/blog" # The path to the folder where the documents are stored  
    create: true # Allow users to create new documents in this collection
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}" # Filename template, e.g., YYYY-MM-DD-title.md
    i18n: true
    fields: # The fields for each document, usually in front matter
      - { label: "Layout", name: "layout", widget: "hidden", default: "layouts/post.html" }
      - { label: "Title", name: "title", widget: "string", i18n: true}
      - { label: "Tags", name: "tags", widget: "list", default: "education" }
      - { label: "Publish Date", name: "date", widget: "datetime",i18n: duplicate }
      - { label: "Summary", name: "summary",widget: "markdown", i18n: true }
      - { label: "Body", name: "body", widget: "markdown", i18n: true }
